version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: to_do_app_container
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19006:19006"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
